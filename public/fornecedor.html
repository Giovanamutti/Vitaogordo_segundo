<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerenciamento - Fornecedores e Obras</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    
    <!-- FORNECEDORES -->
    <section>
      <h1>Cadastro de Fornecedor</h1>
      <div id="avisoFornecedor"></div>

      <form id="formFornecedor">
        <div class="campo">
          <label for="nomeFornecedor">Nome / Razão Social:</label>
          <input type="text" id="nomeFornecedor" name="nome" required>
        </div>

        <div class="campo">
          <label for="cnpj">CNPJ:</label>
          <input type="text" id="cnpj" name="cnpj" required>
        </div>

        <div class="campo">
          <label for="titulos">Títulos:</label>
          <input type="text" id="titulos" name="titulos" required>
        </div>

        <button type="submit">Cadastrar Fornecedor</button>
      </form>

      <h2>Lista de Fornecedores</h2>
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Nome</th>
            <th>CNPJ</th>
            <th>Títulos</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody id="corpoTabelaFornecedores"></tbody>
      </table>
    </section>

    <hr style="margin: 40px 0;">

    <!-- OBRAS -->
    <section>
      <h1>Cadastro de Obras</h1>
      <div id="avisoObras"></div>

      <form id="formObras">
        <div class="campo">
          <label for="nomeObra">Nome da Obra:</label>
          <input type="text" id="nomeObra" name="nome" required>
        </div>

        <div class="campo">
          <label for="categoria">Categoria:</label>
          <input type="text" id="categoria" name="categoria" required>
        </div>

        <div class="campo">
          <label for="numero_de_paginas">Número de Páginas:</label>
          <input type="number" id="numero_de_paginas" name="numero_de_paginas" required>
        </div>

        <div class="campo">
          <label for="editora">Editora:</label>
          <input type="text" id="editora" name="editora" required>
        </div>

        <button type="submit">Cadastrar Obra</button>
      </form>

      <h2>Lista de Obras</h2>
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Nome</th>
            <th>Categoria</th>
            <th>Páginas</th>
            <th>Editora</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody id="corpoTabelaObras"></tbody>
      </table>
    </section>

  </div>

  <script src="fornecedores.js"></script>
  <script src="obras.js"></script>
</body>
</html>
